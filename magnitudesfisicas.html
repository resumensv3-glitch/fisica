<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversor de Magnitudes Físicas</title>
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0f172a;
    }

    .container {
      width: 90%;
      max-width: 800px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.1);
      padding: 30px 40px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #2563eb;
    }

    p {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      display: block;
      color: #374151;
    }

    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    select:focus, input:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1e40af;
    }

    .result-box {
      margin-top: 25px;
      background: #f9fafb;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
    }

    .result {
      font-size: 1.3rem;
      font-weight: 600;
      color: #111827;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  
</head>
<body>


  
  <div class="container">
    <h1>Conversor de Magnitudes Físicas</h1>
    <p>Convierte entre unidades de longitud, masa, tiempo, temperatura, área, volumen, velocidad y energía.</p>

    <div class="grid">
      <div>
        <label for="category">Categoría</label>
        <select id="category"></select>
      </div>

      <div>
        <label for="mode">Modo</label>
        <select id="mode">
          <option value="direct">Directo (de a)</option>
          <option value="quick">Rápido (ejemplos)</option>
        </select>
      </div>

      <div>
        <label for="fromUnit">De</label>
        <select id="fromUnit"></select>
      </div>

      <div>
        <label for="toUnit">A</label>
        <select id="toUnit"></select>
      </div>

      <div>
        <label for="value">Valor</label>
        <input id="value" type="number" step="any" value="1">
      </div>
    </div>

    <div class="buttons">
      <button id="convert">Convertir</button>
      <button id="swap">⇄ Intercambiar</button>
      <button id="reset">Limpiar</button>
    </div>

    <div class="result-box">
      <div class="result" id="resultText">—</div>
      <div id="explain" style="font-size: 14px; color: #6b7280; margin-top: 5px;">Explicación</div>
      <button id="copy" style="margin-top:10px;">Copiar resultado</button>
    </div>

    <footer>Proyecto de conversión — Funciona en cualquier navegador moderno</footer>
  </div>

  <script>
    const CATEGORIES = {
      longitud: {
        name: 'Longitud', base: 'm', units: {
          mm: {name:'Milímetro', to_base: v=>v/1000, from_base: v=>v*1000},
          cm: {name:'Centímetro', to_base: v=>v/100, from_base: v=>v*100},
          m:  {name:'Metro', to_base: v=>v, from_base: v=>v},
          km: {name:'Kilómetro', to_base: v=>v*1000, from_base: v=>v/1000},
          in: {name:'Pulgada', to_base: v=>v*0.0254, from_base: v=>v/0.0254},
          ft: {name:'Pie', to_base: v=>v*0.3048, from_base: v=>v/0.3048}
        }
      },
      masa: {
        name:'Masa', base:'kg', units:{
          mg:{name:'Miligramo', to_base:v=>v/1e6, from_base:v=>v*1e6},
          g:{name:'Gramo', to_base:v=>v/1000, from_base:v=>v*1000},
          kg:{name:'Kilogramo', to_base:v=>v, from_base:v=>v},
          t:{name:'Tonelada', to_base:v=>v*1000, from_base:v=>v/1000},
          lb:{name:'Libra', to_base:v=>v*0.45359237, from_base:v=>v/0.45359237}
        }
      },
      tiempo: {
        name:'Tiempo', base:'s', units:{
          ms:{name:'Milisegundo', to_base:v=>v/1000, from_base:v=>v*1000},
          s:{name:'Segundo', to_base:v=>v, from_base:v=>v},
          min:{name:'Minuto', to_base:v=>v*60, from_base:v=>v/60},
          h:{name:'Hora', to_base:v=>v*3600, from_base:v=>v/3600},
          d:{name:'Día', to_base:v=>v*86400, from_base:v=>v/86400}
        }
      },
      temperatura: {
        name:'Temperatura', base:'K', units:{
          C:{name:'Celsius', to_base:v=>v+273.15, from_base:v=>v-273.15},
          F:{name:'Fahrenheit', to_base:v=>(v-32)*(5/9)+273.15, from_base:v=>(v-273.15)*(9/5)+32},
          K:{name:'Kelvin', to_base:v=>v, from_base:v=>v}
        }
      },
      area: {
        name:'Área', base:'m2', units:{
          m2:{name:'Metro cuadrado', to_base:v=>v, from_base:v=>v},
          cm2:{name:'Centímetro cuadrado', to_base:v=>v/10000, from_base:v=>v*10000},
          km2:{name:'Kilómetro cuadrado', to_base:v=>v*1e6, from_base:v=>v/1e6},
          ha:{name:'Hectárea', to_base:v=>v*10000, from_base:v=>v/10000},
          acre:{name:'Acre', to_base:v=>v*4046.8564224, from_base:v=>v/4046.8564224}
        }
      },
      volumen: {
        name:'Volumen', base:'m3', units:{
          m3:{name:'Metro cúbico', to_base:v=>v, from_base:v=>v},
          L:{name:'Litro', to_base:v=>v/1000, from_base:v=>v*1000},
          mL:{name:'Mililitro', to_base:v=>v/1e6, from_base:v=>v*1e6},
          ft3:{name:'Pie cúbico', to_base:v=>v*0.028316846592, from_base:v=>v/0.028316846592}
        }
      },
      velocidad: {
        name:'Velocidad', base:'m/s', units:{
          'm/s':{name:'Metro/segundo', to_base:v=>v, from_base:v=>v},
          kmh:{name:'Kilómetro/hora', to_base:v=>v/3.6, from_base:v=>v*3.6},
          mph:{name:'Milla/hora', to_base:v=>v*0.44704, from_base:v=>v/0.44704}
        }
      },
      energia: {
        name:'Energía', base:'J', units:{
          J:{name:'Joule', to_base:v=>v, from_base:v=>v},
          kJ:{name:'Kilojoule', to_base:v=>v*1000, from_base:v=>v/1000},
          cal:{name:'Caloría', to_base:v=>v*4.184, from_base:v=>v/4.184},
          kWh:{name:'Kilovatio-hora', to_base:v=>v*3.6e6, from_base:v=>v/3.6e6}
        }
      }
    };

    const categorySel = document.getElementById('category');
    const fromSel = document.getElementById('fromUnit');
    const toSel = document.getElementById('toUnit');
    const valueInp = document.getElementById('value');
    const convertBtn = document.getElementById('convert');
    const resultText = document.getElementById('resultText');
    const explain = document.getElementById('explain');
    const swapBtn = document.getElementById('swap');
    const resetBtn = document.getElementById('reset');
    const copyBtn = document.getElementById('copy');

    function populateCategories(){
      categorySel.innerHTML = '';
      for(const key of Object.keys(CATEGORIES)){
        const opt = document.createElement('option');
        opt.value = key; opt.textContent = CATEGORIES[key].name;
        categorySel.appendChild(opt);
      }
    }

    function populateUnits(catKey){
      const cat = CATEGORIES[catKey];
      fromSel.innerHTML = '';
      toSel.innerHTML = '';
      for(const u of Object.keys(cat.units)){
        const o1 = document.createElement('option'); o1.value = u; o1.textContent = `${u} — ${cat.units[u].name}`;
        const o2 = o1.cloneNode(true);
        fromSel.appendChild(o1); toSel.appendChild(o2);
      }
      fromSel.value = Object.keys(cat.units)[0];
      toSel.value = Object.keys(cat.units)[1] || Object.keys(cat.units)[0];
    }

    function convert(){
      const catKey = categorySel.value;
      const cat = CATEGORIES[catKey];
      const from = fromSel.value; const to = toSel.value;
      let val = Number(valueInp.value);
      if(isNaN(val)){ resultText.textContent = 'Valor no válido'; return; }

      const toBase = cat.units[from].to_base;
      const fromBase = cat.units[to].from_base;
      const baseVal = toBase(val);
      const outVal = fromBase(baseVal);

      const outStr = Number.isFinite(outVal) ? outVal : NaN;
      resultText.textContent = `${outStr} ${to}`;
      explain.textContent = `(${valueInp.value} ${from}) → ${baseVal} ${cat.base} → ${outVal} ${to}`;
    }

    convertBtn.addEventListener('click', ()=>convert());
    swapBtn.addEventListener('click', ()=>{ const a = fromSel.value; fromSel.value = toSel.value; toSel.value = a; convert(); });
    resetBtn.addEventListener('click', ()=>{ valueInp.value=''; resultText.textContent='—'; explain.textContent='Explicación'; });
    copyBtn.addEventListener('click', ()=>{ navigator.clipboard.writeText(resultText.textContent).then(()=>{ copyBtn.textContent='Copiado'; setTimeout(()=>copyBtn.textContent='Copiar resultado',1000); }); });
    categorySel.addEventListener('change', ()=>populateUnits(categorySel.value));
    valueInp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') convert(); });

    populateCategories();
    populateUnits(categorySel.value);
  </script>
</body>
</html>
