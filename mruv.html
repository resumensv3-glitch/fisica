<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simulador Velocidad Media</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="title">SIMULADORES DE FÍSICA</div>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="mru.html">MRU</a>
        <a class="active" href="mruv.html">Velocidad Media</a>
        <a href="magnitudesfisicas.html">CONVERSOR DE MAGNITUDES</a>
        <a href="fuerzaresultante.html">FUERZA RESULTANTE</a>
        <a href="desarrolladores.html">Desarrolladores</a>
      </nav>
    </div>
    <img src="img/logoitca.png" alt="logoitca" class="header-logo">
  </header>

  <main>
    <div>
      <div class="row">
        <div class="card">
          <h3>Ingresa los datos</h3>
          <label>Tiempo inicial t₀ (s)</label><input id="mruv_t0" type="number" step="any" value="0">
          <label>Tiempo final t_f (s)</label><input id="mruv_tf" type="number" step="any" value="5">
          <label>Posición inicial x₀ (m)</label><input id="mruv_x0" type="number" step="any" value="0">
          <label>Posición final x_f (m)</label><input id="mruv_xf" type="number" step="any" value="0.43">
          <label>Velocidad inicial v₀ (m/s)</label><input id="mruv_v0" type="number" step="any" value="">
          <label>Velocidad final v_f (m/s)</label><input id="mruv_vf" type="number" step="any" value="">
          <button id="btnCalcMRUV" onclick="calcVelMedia()">Calcular</button>
          <button class="secondary" onclick="resetAll()">Limpiar</button>
          <button id="btnStartMRUV" onclick="startSimMRUV()" disabled>Iniciar simulación</button>
        </div>

        <div class="card">
          <h3>Resultados</h3>
          <div class="results">
            <p id="out_mruv_x0">Posición inicial: —</p>
            <p id="out_mruv_xf">Posición final: —</p>
            <p id="out_mruv_vm">Velocidad media: — m/s</p>
            <p id="out_mruv_disp">Desplazamiento: — m</p>
            <p id="out_mruv_a">Aceleración: — m/s²</p>
            <p id="out_mruv_tf">Tiempo total Δt: — s</p>
            <p class="note">Cronómetro: <span id="cron2">0.00 s</span></p>
          </div>
        </div>
      </div>

      <div class="track-wrap">
        <div class="track" id="track2">
          <div class="marks" id="marks2"></div>
          <div class="car" id="car2" style="left:var(--margin-px)">
            <div class="body"></div>
            <div class="win"></div>
            <div class="wheel front"></div>
            <div class="wheel back"></div>
            <div class="light"></div>
          </div>
        </div>

        <div id="chartWrap2">
          <canvas id="chart2"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
const CAR_W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--car-w')) || 80;
const MARGIN_PX = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--margin-px')) || 60;
let ctxChart2 = null, animating = false, rafId = null;

// --- DIBUJA MARCAS EN LA PISTA ---
function drawMarks(containerMarksEl, trackEl, x0, xf){
  containerMarksEl.innerHTML = '';
  const trackWidth = trackEl.clientWidth;
  const usable = trackWidth - 2*MARGIN_PX;
  const marks = 10;
  for(let i=0;i<=marks;i++){
    const div = document.createElement('div');
    div.className='mark';
    const pos = MARGIN_PX + i*(usable/marks);
    div.style.left=pos+'px';
    containerMarksEl.appendChild(div);
    const label = document.createElement('div');
    label.className='markLabel';
    label.style.left=pos+'px';
    const val = x0 + (xf-x0)*(i/marks);
    label.textContent = val.toFixed(1);
    containerMarksEl.appendChild(label);
  }
}

// --- CALCULAR VELOCIDAD MEDIA, DESPLAZAMIENTO Y ACELERACIÓN ---
function calcVelMedia(){
  const t0 = parseFloat(document.getElementById('mruv_t0').value) || 0;
  const tf = parseFloat(document.getElementById('mruv_tf').value) || 0;
  const x0 = parseFloat(document.getElementById('mruv_x0').value) || 0;
  const xf = parseFloat(document.getElementById('mruv_xf').value) || 0;
  let v0 = parseFloat(document.getElementById('mruv_v0').value);
  let vf = parseFloat(document.getElementById('mruv_vf').value);

  const deltaT = tf - t0;
  const desplazamiento = xf - x0;

  if (deltaT <= 0) { alert("El tiempo final debe ser mayor que el inicial."); return; }

  const hasV0 = !isNaN(v0);
  const hasVf = !isNaN(vf);

  let a = 0;

  if (hasV0 && hasVf){
    // caso estándar: ambas velocidades dadas
    a = (vf - v0) / deltaT;
  } else if (!hasV0 && hasVf){
    // **Cambio de comportamiento:** si solo hay vf, asumimos v0 = 0
    v0 = 0;
    a = (vf - v0) / deltaT; // => vf / deltaT
  } else if (hasV0 && !hasVf){
    // solo v0 dado -> intentar inferir a desde posición
    a = (2 * (desplazamiento - v0 * deltaT)) / (deltaT * deltaT);
    vf = v0 + a * deltaT;
  } else {
    // ninguna velocidad -> MRU (a = 0)
    a = 0;
    v0 = desplazamiento / deltaT;
    vf = v0;
  }

  const vm = (v0 + vf) / 2;

  // mostrar resultados
  document.getElementById('out_mruv_x0').textContent = `Posición inicial: ${x0} m`;
  document.getElementById('out_mruv_xf').textContent = `Posición final: ${xf} m`;
  document.getElementById('out_mruv_vm').textContent = `Velocidad media: ${vm.toFixed(2)} m/s`;
  document.getElementById('out_mruv_disp').textContent = `Desplazamiento Δx: ${desplazamiento.toFixed(2)} m`;
  document.getElementById('out_mruv_a').textContent = `Aceleración a: ${a.toFixed(2)} m/s²`;
  document.getElementById('out_mruv_tf').textContent = `Tiempo total Δt: ${deltaT.toFixed(2)} s`;
  document.getElementById('btnStartMRUV').disabled = false;

  // actualizar gráfica (posición vs tiempo)
  drawMarks(document.getElementById('marks2'), document.getElementById('track2'), x0, xf);
  const dataT = [], dataX = [];
  const steps = 100;
  for (let i=0;i<=steps;i++){
    const t = t0 + deltaT*(i/steps);
    const dt = t - t0;
    const x = x0 + v0*dt + 0.5*a*dt*dt;
    dataT.push(t); dataX.push(x);
  }
  if (ctxChart2) ctxChart2.destroy();
  const canvas = document.getElementById('chart2');
  ctxChart2 = new Chart(canvas,{type:'line',data:{labels:dataT,datasets:[{label:'Posición (m)',data:dataX,borderColor:'#e84c3d',fill:false}]},options:{responsive:true,scales:{x:{title:{display:true,text:'Tiempo (s)'}},y:{title:{display:true,text:'Distancia (m)'}}}}});
}


// --- ANIMACIÓN DEL CARRITO ---
function startSimMRUV(){
  if(animating){ cancelAnimationFrame(rafId); animating=false; return; }

  const car = document.getElementById('car2');
  const track = document.getElementById('track2');
  const x0 = parseFloat(document.getElementById('mruv_x0').value)||0;
  const xf = parseFloat(document.getElementById('mruv_xf').value)||0;
  const t0 = parseFloat(document.getElementById('mruv_t0').value)||0;
  const tf = parseFloat(document.getElementById('mruv_tf').value)||1;
  const trackWidth = track.clientWidth;
  const usable = trackWidth - 2*MARGIN_PX;
  const startLeft = MARGIN_PX;
  const endLeft = MARGIN_PX + usable - CAR_W;
  let startTime = null;

  document.getElementById('cron2').textContent = '0.00 s';

  function animate(timestamp){
    if(!startTime) startTime = timestamp;
    const elapsed = (timestamp - startTime)/1000;
    const total = tf - t0 || 1;
    const ratio = elapsed / total;

    if(ratio >= 1){
      car.style.left = endLeft + 'px';
      document.getElementById('cron2').textContent = total.toFixed(2) + ' s';
      cancelAnimationFrame(rafId);
      animating = false;
      return;
    }

    car.style.left = startLeft + (endLeft - startLeft) * ratio + 'px';
    document.getElementById('cron2').textContent = elapsed.toFixed(2) + ' s';
    rafId = requestAnimationFrame(animate);
  }

  animating = true;
  rafId = requestAnimationFrame(animate);
}

// --- REINICIAR TODO ---
function resetAll(){
  cancelAnimationFrame(rafId);
  animating = false;
  document.querySelectorAll('input[type=number]').forEach(i=>i.value='');
  document.querySelectorAll('.results p').forEach(p=>{
    if(!p.classList.contains('note')) p.textContent=p.textContent.split(':')[0]+': —';
  });
  document.getElementById('cron2').textContent='0.00 s';
  document.getElementById('btnStartMRUV').disabled=true;
  document.getElementById('car2').style.left=MARGIN_PX+'px';
  document.getElementById('marks2').innerHTML='';
  if(ctxChart2) ctxChart2.destroy(); ctxChart2=null;
}
  </script>
</body>
</html>
